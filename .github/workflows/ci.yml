name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habitat_test
          POSTGRES_PASSWORD: habitat_test
          POSTGRES_USER: habitat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habitat_test -d habitat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALLOW_DESTRUCTIVE_TEST_DATABASE: "true"
      APP_BASE_URL: http://127.0.0.1:3000
      APP_ENV: test
      BETTER_AUTH_SECRET: ci-test-secret-that-is-not-valid-outside-this-disposable-job
      BETTER_AUTH_URL: http://127.0.0.1:3000
      CI: "true"
      DATABASE_URL: postgresql://habitat_test:habitat_test@localhost:5432/habitat_test?schema=public
      DIRECT_DATABASE_URL: postgresql://habitat_test:habitat_test@localhost:5432/habitat_test?schema=public
      SHADOW_DATABASE_URL: postgresql://habitat_test:habitat_test@localhost:5432/habitat_shadow_test?schema=public
      ENABLE_TEST_AUTH: "false"
      GOOGLE_WORKSPACE_DOMAIN: example.org
      NEXT_PUBLIC_APP_ENV: test
      NODE_VERSION: 22.22.3
      PNPM_VERSION: 10.13.1
      STORAGE_DRIVER: local
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject high-severity dependency advisories
        run: pnpm audit --audit-level high

      - name: Create isolated Prisma migration shadow database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE habitat_shadow_test'

      - name: Guard disposable PostgreSQL target
        run: pnpm exec tsx tests/support/assert-destructive-test-database.ts

      - name: Guard disposable Prisma migration and shadow targets
        run: pnpm db:test:assert-migration-environment

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply committed migrations to disposable PostgreSQL
        run: pnpm db:migrate:deploy

      - name: Confirm migration status
        run: pnpm db:migrate:status

      - name: Confirm migrations match the Prisma schema
        run: pnpm db:migrate:diff

      - name: Seed code-defined capability catalog
        run: pnpm db:seed

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run PostgreSQL identity and constraint tests
        run: pnpm test:integration

      - name: Build production application
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end smoke tests
        run: pnpm test:e2e:smoke

      - name: Upload Playwright report
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
